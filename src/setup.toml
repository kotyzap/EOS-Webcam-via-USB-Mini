# EOS Webcam virtual camera scene (Isocast setup file): the /view page of eos-webcam.js over a text card.
version = 1
name = "EOS Webcam"

[canvas]
width = 1280
height = 720
fps = 30

[[sources]]
id = "canon"
name = "Canon 80D"
kind = "browser"
url = "http://127.0.0.1:8809/view"
width = 1280
height = 720
fps = 30

# The card that call apps see whenever there is no live picture.
[[sources]]
id = "card-bg"
name = "Card background"
kind = "color"
color = "#1e1e1e"

[[sources]]
id = "card-title"
name = "Card title"
kind = "text"
text = "EOS Webcam"
size = 96.0
color = "#ffffff"
align = "center"

[[sources]]
id = "not-live"
name = "Card subtitle"
kind = "text"
text = "Camera is not live"
size = 30.0
color = "#9a9a9a"
align = "center"

[[scenes]]
id = "eos"
name = "EOS"

# Card layers, drawn behind the camera picture.
[[scenes.items]]
source = "card-bg"
fit = "stretch"
rect = { x = 0, y = 0, width = 1280, height = 720 }

[[scenes.items]]
source = "card-title"
fit = "contain"
rect = { x = 240, y = 275, width = 800, height = 110 }

[[scenes.items]]
source = "not-live"
fit = "contain"
rect = { x = 240, y = 405, width = 800, height = 38 }

[[scenes.items]]
source = "canon"
fit = "cover"
rect = { x = 0, y = 0, width = 1280, height = 720 }

[virtual_camera]
target = "program"

# Recording is not used; Isocast requires the section.
[recording]
folder = "~/Movies/Isocast"
keep_free_gb = 1.0

[recording.program]
enabled = false
filename = "{date} {time}"
audio = []

[recording.program.encoder]
codec = "h264"
quality = "high"
container = "mp4"
bit_depth = 8

[recording.iso]
enabled = false
sources = []
filename = "{SOURCE}-{date} {time}"

[recording.iso.encoder]
codec = "hevc"
quality = "high"
container = "mp4"
